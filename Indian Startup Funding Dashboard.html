<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1c1a45;--mute:#62667f;--line:#d9dde8;--a:#f0a202;--b:#2a9d8f;--bar:#3b3a8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12112b;--card:#1c1a45;--ink:#eceefb;--mute:#a3a6c8;--line:#34336a;--bar:#8d8cf0}}
:root[data-theme="dark"]{--bg:#12112b;--card:#1c1a45;--ink:#eceefb;--mute:#a3a6c8;--line:#34336a;--bar:#8d8cf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45}
main{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:0;letter-spacing:-.02em}
.note{color:var(--mute);font-size:.85rem;margin:4px 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
select,button.reset{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
select:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.kpis{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi b{display:block;font-size:1.5rem;font-weight:800}
.kpis .lead{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lead b{font-size:2.6rem;color:var(--a)}
.kpi span,h2{color:var(--mute);font-size:.85rem;font-weight:600;margin:0}
.lead span{color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.cols{display:flex;align-items:end;gap:8px;height:190px;margin-top:12px}
.col{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;font:inherit;font-size:.75rem;color:var(--mute);background:none;border:0;padding:0;cursor:pointer}
.col i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px;margin-top:3px}
.col em{font-style:normal;color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:104px 1fr 62px;gap:8px;align-items:center;width:100%;font:inherit;font-size:.85rem;color:var(--ink);background:none;border:0;border-radius:6px;padding:4px;margin-top:3px;text-align:left;cursor:pointer}
.row u{display:block;height:10px;border-radius:5px;background:var(--b)}
.row span:last-child{text-align:right;font-weight:600}
.row.on{outline:2px solid var(--a)}
.static{cursor:default}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
td:last-child,th:last-child{text-align:right;font-weight:600}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.lead{grid-column:1/-1}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Indian startup funding</h1>
<p class="note" id="meta"></p>
<div class="filters"><select id="yr" aria-label="Year"></select><select id="sec" aria-label="Sector"></select><select id="cty" aria-label="City"></select><select id="rnd" aria-label="Funding round"></select><select id="mea" aria-label="Measure"><option value="a">Measure: funding</option><option value="n">Measure: deal count</option></select><button class="reset" id="clr">Clear filters</button></div>
<section class="kpis" id="kpis"></section>
<section class="grid">
<div class="card"><h2 id="t1"></h2><div class="cols" id="years"></div></div>
<div class="card"><h2 id="t2"></h2><div id="sectors" data-k="s"></div></div>
<div class="card"><h2 id="t3"></h2><div id="cities" data-k="c"></div></div>
<div class="card"><h2 id="t4"></h2><div id="rounds" data-k="r"></div></div>
</section>
<section class="grid">
<div class="card"><h2>Most active investors (deals in view)</h2><div id="inv"></div></div>
<div class="card"><h2>Largest deals in view</h2><div class="wrap"><table id="tbl"></table></div></div>
</section>
<p class="note">Click a year column or any sector, city or round bar to filter. Amounts are in USD. 2025 covers January to June only.</p>
</main>
